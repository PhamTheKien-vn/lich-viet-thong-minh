<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lịch Việt - Trợ Lý Thông Minh</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#a61d24">
    
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3652/3652191.png">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3652/3652191.png">
    <link rel="manifest" href="data:application/manifest+json,{'name':'Lịch Việt','short_name':'Lịch Việt','start_url':'.','display':'standalone','background_color':'#ffffff','theme_color':'#a61d24','icons':[{'src':'https://cdn-icons-png.flaticon.com/512/3652/3652191.png','sizes':'512x512','type':'image/png'}]}">

    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.js"></script>
    
    <style>
        :root { --primary-red: #a61d24; --accent-gold: #d4af37; --bg: #f4f4f4; --holiday: #d32f2f; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); margin: 0; display: flex; justify-content: center; -webkit-tap-highlight-color: transparent; }
        .app-container { width: 100%; max-width: 480px; background: #fff; min-height: 100vh; display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.1); }

        /* Header */
        .header { background: var(--primary-red); color: white; padding: 20px 15px 15px 15px; text-align: center; border-bottom: 3px solid var(--accent-gold); position: sticky; top: 0; z-index: 100; }
        .header h1 { margin: 0 0 10px 0; font-size: 1.3rem; color: var(--accent-gold); letter-spacing: 2px; text-transform: uppercase; }
        .selector-row { display: flex; justify-content: center; gap: 10px; }
        .selector-row select { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--accent-gold); font-weight: bold; background: #fff; font-size: 0.9rem; }

        /* Grid Lịch */
        .grid { display: grid; grid-template-columns: repeat(7, 1fr); background: #fff; }
        .weekday { text-align: center; padding: 10px 0; font-size: 0.75rem; font-weight: bold; color: #888; background: #f9f9f9; border-bottom: 1px solid #eee; }
        .day { aspect-ratio: 1/1.3; border-right: 1px solid #f0f0f0; border-bottom: 1px solid #f0f0f0; display: flex; flex-direction: column; align-items: center; padding-top: 8px; cursor: pointer; position: relative; transition: background 0.2s; }
        .day:active { background: #f0f0f0; }
        .solar { font-size: 1.15rem; font-weight: 600; color: #333; }
        .lunar { font-size: 0.7rem; color: #777; margin-top: 1px; }
        
        /* Ngày lễ & Cuối tuần */
        .is-holiday .solar, .is-holiday .lunar, .h-name { color: var(--holiday) !important; }
        .h-name { font-size: 0.55rem; text-align: center; line-height: 1.1; height: 12px; margin-top: 2px; overflow: hidden; font-weight: 500; width: 95%; }
        .is-today { background: #fff5f5; box-shadow: inset 0 0 0 2px var(--primary-red); }

        /* Chấm nhắc nhở */
        .dot-box { display: flex; gap: 2px; position: absolute; bottom: 4px; }
        .dot { width: 6px; height: 6px; border-radius: 50%; }
        .dot-blue { background: #2196f3; }
        .dot-pink { background: #e91e63; }

        /* Lời nhắc & Tìm kiếm */
        .rem-section { padding: 15px; background: #fff; border-top: 8px solid #eee; flex-grow: 1; }
        .search-box { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; margin-bottom: 15px; box-sizing: border-box; font-size: 0.95rem; background: #f9f9f9; }
        .rem-item { background: #fdfdfd; border-left: 5px solid #ddd; padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .rem-item.blue { border-left-color: #2196f3; }
        .rem-item.pink { border-left-color: #e91e63; }
        .rem-date-label { font-size: 0.7rem; font-weight: bold; color: var(--primary-red); margin-bottom: 3px; }

        /* Nút thao tác */
        .backup-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; background: #f9f9f9; border-top: 1px solid #eee; }
        .btn-action { padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 0.8rem; font-weight: bold; cursor: pointer; background: #fff; color: #555; }
        
        /* Modal */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; z-index: 199; backdrop-filter: blur(3px); }
        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 380px; background: #fff; border-radius: 20px; display: none; z-index: 200; overflow: hidden; animation: zoomIn 0.3s ease; }
        @keyframes zoomIn { from { opacity: 0; transform: translate(-50%, -45%) scale(0.95); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
        .modal-head { background: var(--primary-red); color: var(--accent-gold); padding: 20px; text-align: center; }
        .modal-body { padding: 20px; }
        textarea { width: 100%; height: 90px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; padding: 12px; box-sizing: border-box; font-size: 1rem; font-family: inherit; outline: none; }
        .btn-save { width: 100%; padding: 15px; background: var(--primary-red); color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 1rem; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>LỊCH VIỆT</h1>
        <div class="selector-row">
            <select id="selM" onchange="render()"></select>
            <select id="selY" onchange="render()"></select>
        </div>
    </div>
    
    <div class="grid" id="grid"></div>

    <div class="rem-section">
        <input type="text" id="searchIn" class="search-box" placeholder="🔍 Tìm nhanh sự kiện..." oninput="updateList()">
        <div id="remList"></div>
    </div>

    <div class="backup-controls">
        <button class="btn-action" onclick="exportData()">📤 Sao lưu</button>
        <button class="btn-action" onclick="document.getElementById('fileIn').click()">📥 Khôi phục</button>
        <input type="file" id="fileIn" style="display:none" onchange="importData(event)">
    </div>
</div>

<div class="overlay" id="overlay" onclick="closeAll()"></div>

<div class="modal" id="modal">
    <div class="modal-head">
        <div id="mS" style="font-size: 2.8rem; font-weight: 800;"></div>
        <div id="mInfo" style="font-size: 0.95rem; opacity: 0.9;"></div>
    </div>
    <div class="modal-body">
        <label style="font-size: 0.8rem; font-weight: bold; color: #666;">NỘI DUNG</label>
        <textarea id="noteIn" placeholder="Ví dụ: Giỗ ông nội, Sinh nhật vợ..."></textarea>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <select id="lunarOpt" style="padding: 10px; border-radius: 8px;"><option value="false">Dương lịch</option><option value="true">Âm lịch 🌙</option></select>
            <select id="typeOpt" style="padding: 10px; border-radius: 8px;"><option value="blue">🔔 Lời nhắc</option><option value="pink">🎂 Kỷ niệm</option></select>
        </div>
        <div style="margin-top: 15px;">
            <label style="font-size: 0.9rem; display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="repOpt" style="width: 18px; height: 18px;"> Nhắc lại hàng năm
            </label>
        </div>
        <button class="btn-save" style="margin-top: 20px;" onclick="save()">LƯU LỜI NHẮC</button>
    </div>
</div>

<script>
    const selM = document.getElementById('selM'), selY = document.getElementById('selY'), grid = document.getElementById('grid'), remList = document.getElementById('remList');
    let activeDate = null;

    const CAN = { '甲':'Giáp','乙':'Ất','丙':'Bính','丁':'Đinh','戊':'Mậu','己':'Kỷ','庚':'Canh','辛':'Tân','壬':'Nhâm','癸':'Quý' };
    const CHI = { '子':'Tý','丑':'Sửu','寅':'Dần','卯':'Mão','辰':'Thìn','巳':'Tỵ','午':'Ngọ','未':'Mùi','申':'Thân','酉':'Dậu','戌':'Tuất','亥':'Hợi' };
    function vn(t) { return t ? t.split('').map(c => (CAN[c] || CHI[c] || c) + " ").join('').trim() : ""; }

    const holidays = {
        solar: { '1-1': 'Tết Tây', '14-2': 'Valentine', '8-3': 'Phụ nữ QT', '30-4': 'Giải Phóng', '1-5': 'Quốc tế LĐ', '2-9': 'Quốc Khánh', '20-10': 'Phụ nữ VN', '20-11': 'Nhà giáo VN', '25-12': 'Noel' },
        lunar: { '1-1': 'Tết Nguyên Đán', '2-1': 'Tết Nguyên Đán', '3-1': 'Tết Nguyên Đán', '10-3': 'Giỗ Tổ Hùng Vương', '15-8': 'Trung Thu', '23-12': 'Táo Quân', '30-12': 'Giao Thừa' }
    };

    for(let i=1; i<=12; i++) selM.innerHTML += `<option value="${i}">Tháng ${i}</option>`;
    for(let i=1900; i<=2100; i++) selY.innerHTML += `<option value="${i}">Năm ${i}</option>`;
    const now = new Date(); selM.value = now.getMonth()+1; selY.value = now.getFullYear();

    function render() {
        const m = +selM.value, y = +selY.value;
        grid.innerHTML = ['T2','T3','T4','T5','T6','T7','CN'].map(t => `<div class="weekday">${t}</div>`).join('');
        const first = new Date(y, m-1, 1), last = new Date(y, m, 0);
        let offset = first.getDay() === 0 ? 6 : first.getDay() - 1;
        for(let i=0; i<offset; i++) grid.innerHTML += `<div class="day" style="opacity:0"></div>`;

        const db = JSON.parse(localStorage.getItem('lv_db') || '{}');

        for(let d=1; d<=last.getDate(); d++) {
            const date = new Date(y, m-1, d);
            const l = Lunar.fromDate(date);
            const ld = l.getDay(), lm = l.getMonth();
            const sK = `${d}-${m}`, lK = `${ld}-${lm}`;
            const holidayName = holidays.solar[sK] || holidays.lunar[lK] || "";
            
            const dKey = `D-${y}-${m}-${d}`, rKey = `DR-${m}-${d}`, aKey = `L-${lm}-${ld}`, arKey = `LR-${lm}-${ld}`;
            const event = db[dKey] || db[rKey] || db[aKey] || db[arKey];

            grid.innerHTML += `
                <div class="day ${date.getDay()===0 || holidayName ?'is-holiday':''} ${now.toDateString()===date.toDateString()?'is-today':''}" onclick="openModal(${y},${m},${d})">
                    <div class="solar">${d}</div>
                    <div class="lunar">${ld===1?ld+'/'+lm:ld}</div>
                    <div class="h-name">${holidayName}</div>
                    <div class="dot-box">${event ? `<div class="dot dot-${event.type}"></div>`:''}</div>
                </div>`;
        }
        updateList();
    }

    function openModal(y, m, d) {
        const l = Lunar.fromDate(new Date(y, m-1, d));
        activeDate = { y, m, d, lm: l.getMonth(), ld: l.getDay() };
        document.getElementById('mS').innerText = d;
        document.getElementById('mInfo').innerHTML = `Âm lịch: ${l.getDay()}/${l.getMonth()}<br>Năm ${vn(l.getYearInGanZhi())}`;
        document.getElementById('noteIn').value = "";
        document.getElementById('overlay').style.display = 'block';
        document.getElementById('modal').style.display = 'block';
    }

    function save() {
        const text = document.getElementById('noteIn').value.trim();
        if(!text) return;
        const db = JSON.parse(localStorage.getItem('lv_db') || '{}');
        const isL = document.getElementById('lunarOpt').value === 'true';
        const isR = document.getElementById('repOpt').checked;
        const key = isL ? (isR ? `LR-${activeDate.lm}-${activeDate.ld}` : `L-${activeDate.lm}-${activeDate.ld}`) 
                        : (isR ? `DR-${activeDate.m}-${activeDate.d}` : `D-${activeDate.y}-${activeDate.m}-${activeDate.d}`);
        db[key] = { text, type: document.getElementById('typeOpt').value };
        localStorage.setItem('lv_db', JSON.stringify(db));
        closeAll(); render();
    }

    function updateList() {
        const db = JSON.parse(localStorage.getItem('lv_db') || '{}');
        const search = document.getElementById('searchIn').value.toLowerCase();
        const keys = Object.keys(db).filter(k => db[k].text.toLowerCase().includes(search));
        
        remList.innerHTML = keys.length ? "" : "<p style='text-align:center;color:#999;font-size:0.85rem;'>Không có dữ liệu.</p>";
        keys.forEach(k => {
            const ev = db[k];
            let label = k.includes('LR') ? "Âm lịch hàng năm" : k.includes('L-') ? "Âm lịch" : k.includes('DR') ? "Hàng năm" : "Sự kiện";
            remList.innerHTML += `<div class="rem-item ${ev.type}">
                <div><div class="rem-date-label">${label}</div><div style="font-size:0.95rem; font-weight:500;">${ev.text}</div></div>
                <button onclick="del('${k}')" style="border:none;background:none;color:#ff4d4d;font-size:1.5rem;cursor:pointer;">&times;</button>
            </div>`;
        });
    }

    function del(k) { if(confirm("Xóa sự kiện này?")){ const db=JSON.parse(localStorage.getItem('lv_db')||'{}'); delete db[k]; localStorage.setItem('lv_db',JSON.stringify(db)); render(); } }
    function closeAll() { document.querySelectorAll('.modal, .overlay').forEach(el => el.style.display = 'none'); }

    function exportData() {
        const data = localStorage.getItem('lv_db');
        const blob = new Blob([data], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `lichviet_backup_${new Date().toLocaleDateString()}.json`;
        a.click();
    }

    function importData(e) {
        const reader = new FileReader();
        reader.onload = (ev) => {
            try { JSON.parse(ev.target.result); localStorage.setItem('lv_db', ev.target.result); render(); alert("Đã khôi phục thành công!"); }
            catch(err) { alert("File không hợp lệ!"); }
        };
        reader.readAsText(e.target.files[0]);
    }

    render();
</script>
</body>
</html>
